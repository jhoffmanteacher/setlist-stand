# The repo's own checks, after every push to main and on every pull request (2026-11-20).
# Nothing here blocks a push or the Pages deploy: a red run means "look at the last push".
# Actions are pinned to a full commit SHA, release in a comment (the same pins as guitar-class).
name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: node tools/checks.mjs
        run: node tools/ci/run-and-annotate.mjs --title "checks" --log "$RUNNER_TEMP/ci-out/checks.log" --summary '^(PASS|FAIL|SKIP)' --deadline 8 -- node tools/checks.mjs
      - name: node tools/ci/annotate-selftest.mjs
        run: node tools/ci/annotate-selftest.mjs

  # The name checker (tools/lint.mjs + eslint.config.mjs): ESLint fetched by npx at pinned versions. REPORT-ONLY:
  # it never fails the run (continue-on-error, and the tool exits 0); findings show as warnings on the run page.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: node tools/lint.mjs (report-only)
        run: node tools/lint.mjs --github
