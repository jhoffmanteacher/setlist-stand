<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Content Security Policy: only this site's own files run or load; nothing from any other host, no eval.
     style-src 'unsafe-inline': the app and pdf.js set style="" attributes (colour swatches, crop box, page sizes).
     img-src/connect-src blob: data:: downloads and PDF bytes travel as blob: URLs. connect-src also lets the page send
     DATA requests (never scripts) to https://www.googleapis.com, the Google Drive connection (js/driveconfig.js); the
     Google sign-in is the page navigating to Google, which a CSP does not govern. worker-src blob: lets pdf.js
     fall back to a blob worker. pdf.js runs with isEvalSupported:false (js/util.js), so it never needs 'unsafe-eval'.
     frame-ancestors cannot be set from a meta tag. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data: https://www.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Setlist Stand</title>
<meta name="theme-color" content="#17181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setlist Stand">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js" defer></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/jszip.min.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Setlist Stand</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tLib" aria-selected="true">Library</button>
      <button role="tab" id="tSets" aria-selected="false">Setlists</button>
    </div>
  </header>
  <div id="warn"></div>
  <div id="nostart" class="nostart" role="alert" hidden><p>Setlist Stand did not start. Your music is safe.</p><button type="button" id="nostartReload">Reload</button></div>
  <main id="view"></main>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="newVersionFile" accept="application/pdf,.pdf" hidden>
<input type="file" id="restoreFile" accept=".zip,application/zip" hidden>
<input type="file" id="splitFile" accept="application/pdf,.pdf" hidden>
<input type="file" id="shareFile" accept=".zip,application/zip" hidden>
<input type="file" id="chartUpdateFile" accept=".zip,application/zip" hidden>
<input type="file" id="setTextFile" accept=".txt,text/plain" hidden>

<section id="viewer" aria-label="Music viewer">
  <div id="stage"></div>
  <div id="nextup" hidden></div>
  <div class="chrome" id="vtop">
    <button id="vBack">Back</button>
    <div class="ttl"><b id="vTitle"></b><span id="vSub"></span></div>
    <button id="vPrev" aria-label="Previous page">&#8249;</button>
    <button id="vNext" aria-label="Next page">&#8250;</button>
    <button id="vCrop">Crop</button>
    <button id="vAnn" aria-pressed="false">Annotate</button>
    <button id="v2up" aria-pressed="true">Two pages</button>
    <button id="vFull">Full screen</button>
    <button id="vAwake" aria-pressed="false" aria-label="Keep screen on" title="Keep screen on"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/><path class="slash" d="M3.5 3.5l17 17"/></svg></button>
  </div>
  <div class="chrome" id="tools" hidden>
    <button class="sw" data-tool="pen" data-color="#1a1a1a" aria-label="Black pen"><i style="background:#1a1a1a"></i></button>
    <button class="sw" data-tool="pen" data-color="#d62828" aria-label="Red pen"><i style="background:#d62828"></i></button>
    <button class="sw" data-tool="pen" data-color="#1f5fd6" aria-label="Blue pen"><i style="background:#1f5fd6"></i></button>
    <span class="wdwrap">
      <button class="sw wd" id="tWidth" data-cur="medium" aria-haspopup="true" aria-expanded="false" aria-label="Line thickness"><i></i></button>
      <span class="wdmenu" id="wdMenu" role="group" aria-label="Line thickness" hidden>
        <button class="sw wd" data-width="thin" aria-label="Thin line"><i></i></button>
        <button class="sw wd" data-width="medium" aria-label="Medium line"><i></i></button>
        <button class="sw wd" data-width="thick" aria-label="Thick line"><i></i></button>
      </span>
    </span>
    <button class="sw hl" data-tool="hl" data-color="#ffd400" aria-label="Yellow highlighter"><i style="background:#ffd400"></i></button>
    <button class="sw hl" data-tool="hl" data-color="#7be07b" aria-label="Green highlighter"><i style="background:#7be07b"></i></button>
    <button data-tool="erase">Eraser</button>
    <button data-tool="text">Text</button>
    <span class="gap"></span>
    <button id="tUndo">Undo</button>
    <button id="tClear">Clear page</button>
    <button id="tFinger" aria-pressed="false">Finger draws</button>
    <button id="tDone" class="pri">Done</button>
  </div>
</section>
<section id="cropper" aria-label="Crop page" hidden>
  <div id="cropStage"><div id="cropSheet"><canvas id="cropCv"></canvas><div id="cropBox">
    <i class="ch" data-h="nw"></i><i class="ch" data-h="n"></i><i class="ch" data-h="ne"></i><i class="ch" data-h="e"></i>
    <i class="ch" data-h="se"></i><i class="ch" data-h="s"></i><i class="ch" data-h="sw"></i><i class="ch" data-h="w"></i>
  </div></div></div>
  <div class="chrome" id="cropBar">
    <div class="ttl"><b>Crop</b><span id="cropHint">Drag the edges and corners</span></div>
    <button id="cropPrev" aria-label="Previous page">&#8249;</button><button id="cropNext" aria-label="Next page">&#8250;</button>
    <button id="cropPage" class="pri">Crop this page</button>
    <button id="cropSong">Crop whole song</button>
    <button id="cropReset">Reset</button>
    <button id="cropCancel">Cancel</button>
  </div>
</section>
<section id="splitter" aria-label="Split a songbook" hidden>
  <div id="splitBar">
    <div class="ttl"><b id="splitTitle" tabindex="-1"></b><span id="splitSub"></span></div>
    <button id="splitCancel">Cancel</button>
    <button id="splitGo" class="pri">Add songs</button>
  </div>
  <div id="splitBody">
    <div id="splitSide">
      <p class="hint" id="splitHint"></p>
      <div class="splitopts">
        <input type="text" id="splitArtist" maxlength="200" placeholder="Artist for every song (optional)" aria-label="Artist for every song (optional)">
        <button id="splitAll">Tick all</button><button id="splitNone">Tick none</button>
      </div>
      <ul id="splitRows" class="list"></ul>
      <label class="sw-row"><input type="checkbox" id="splitAgain">Add a song again even if it is already in my library</label>
    </div>
    <div id="splitMain">
      <div class="splitopts"><span class="hint" id="splitPagesHint">Tap the first page of a song to add it to the list.</span><button id="splitBig" aria-pressed="false">Bigger pages</button></div>
      <div id="splitPages"></div>
    </div>
  </div>
</section>
<div id="toast" role="status"></div>
<button id="update" hidden>Updated. Tap to reload</button>

<script type="module" src="js/main.js"></script>
</body>
</html>
